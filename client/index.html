  <body>
    <div id="root"></div>
    <script>
      // Fix Vite HMR WebSocket URL for non-standard environments
      (function() {
        if (typeof window !== 'undefined') {
          const OriginalWebSocket = window.WebSocket;
          const isReplitEnv = location.hostname.includes('.replit.') || 
                              location.hostname.includes('.repl.co') ||
                              location.hostname.includes('.worf.replit.dev');
          
          // Suppress Vite HMR error messages in Replit
          if (isReplitEnv) {
            const originalError = console.error;
            console.error = function(...args) {
              const msg = args[0];
              if (typeof msg === 'string' && (
                msg.includes('[vite] failed to connect') ||
                msg.includes('localhost:undefined') ||
                msg.includes('WebSocket (failing)')
              )) {
                return; // Suppress HMR connection errors in Replit
              }
              return originalError.apply(console, args);
            };
          }
          
          function PatchedWebSocket(url, protocols) {
            // Handle Vite HMR connections with broken localhost:undefined URLs
            if (typeof url === 'string' && url.includes('localhost:undefined')) {
              if (isReplitEnv) {
                // In Replit, skip HMR connections silently
                console.debug('[Bratvacoder] Hot reload desativado no Replit - use F5');
                // Return a mock WebSocket that does nothing
                return {
                  readyState: 3, // CLOSED
                  send: function() {},
                  close: function() {},
                  addEventListener: function() {},
                  removeEventListener: function() {},
                  dispatchEvent: function() { return true; }
                };
              } else {
                // Outside Replit, fix the URL for proper HMR
                let fixedUrl = url.replace(
                  /wss?:\/\/localhost:undefined/,
                  `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`
                );
                if (fixedUrl.includes('token=') && !fixedUrl.includes('/vite-hmr')) {
                  const urlObj = new URL(fixedUrl);
                  urlObj.pathname = '/vite-hmr';
                  fixedUrl = urlObj.toString();
                }
                console.debug('[HMR] Fixed WebSocket URL:', fixedUrl);
                return new OriginalWebSocket(fixedUrl, protocols);
              }
            }
            return new OriginalWebSocket(url, protocols);
          }
          
          PatchedWebSocket.prototype = OriginalWebSocket.prototype;
          PatchedWebSocket.CONNECTING = OriginalWebSocket.CONNECTING;
          PatchedWebSocket.OPEN = OriginalWebSocket.OPEN;
          PatchedWebSocket.CLOSING = OriginalWebSocket.CLOSING;
          PatchedWebSocket.CLOSED = OriginalWebSocket.CLOSED;
          
          window.WebSocket = PatchedWebSocket;
        }
      })();
    </script>
